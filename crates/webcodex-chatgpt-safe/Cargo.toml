[package]
name = "webcodex-chatgpt-safe"
version.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "webcodex-chatgpt-safe"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webcodex-process = { path = "../webcodex-process" }
webcodex-workspace = { path = "../webcodex-workspace" }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
