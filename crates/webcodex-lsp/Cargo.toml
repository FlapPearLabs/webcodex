[package]
name = "webcodex-lsp"
version.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[features]
default = []
real-process-tests = []

[dependencies]
webcodex-core = { path = "../webcodex-core" }
webcodex-process = { path = "../webcodex-process" }
webcodex-runner-config = { path = "../webcodex-runner-config" }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
url = "2"

# O_NOFOLLOW is load-bearing for document reads: hand-written flag literals were
# silently wrong on Darwin (0o400000 is O_NOCTTY there, not O_NOFOLLOW), which
# left the symlink window open while the code read as if it were closed. Only
# the libc constants are correct per platform, so this is a real dependency
# rather than an optimisation.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
