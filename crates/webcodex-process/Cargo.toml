[package]
name = "webcodex-process"
version.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The native enforcement probe generates its own fixtures under a temp dir
# rather than depending on a fixed path, so `tempfile` is a real dependency of
# that binary and not only of the test suite.
tempfile = "3"

[[bin]]
name = "process-tree-helper"
path = "src/bin/process_tree_helper.rs"

[[bin]]
name = "seatbelt-ae-probe"
path = "src/bin/seatbelt_ae_probe.rs"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
sha2 = "0.10"
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }

# The integration tests probe process liveness directly (OpenProcess +
# GetExitCodeProcess) instead of shelling out to tasklist.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
